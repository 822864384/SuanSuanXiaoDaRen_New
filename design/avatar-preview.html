<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>角色与头像 · 现状预览</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 28px 56px;
    background: #0b1026; color: #dfe6ff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 6px; color: #fff; font-weight: 600; }
  .sub { font-size: 13px; color: #7d90c9; margin: 0 0 26px; line-height: 1.8; }
  h2 { font-size: 14px; color: #ffd76e; margin: 32px 0 12px; font-weight: 600; letter-spacing: .5px; }
  .note { font-size: 12px; color: #7d90c9; margin: 10px 0 0; line-height: 1.8; }
  .frame {
    border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.09);
    background-image: linear-gradient(to bottom, #141b3d, #233a7d);
  }
  /* 电视端 1920px 宽：1rpx = 2.56px，下面全按真实像素画 */
  .home-top { display: flex; align-items: center; gap: 6px; padding: 44px 69px 24px; }
  .chip {
    display: flex; align-items: center; height: 69px; padding: 0 31px;
    border-radius: 33px; background: rgba(255,255,255,.08);
  }
  .chip-text { color: #fff; font-size: 31px; }
  .chip-gold { color: #ffd76e; font-size: 31px; }
  .chip-face-emoji { font-size: 31px; margin-right: 13px; }
  .top-space { flex: 1; }

  .prof-row { display: flex; align-items: center; gap: 30px; padding: 24px 69px 44px; }
  .pcard {
    width: 400px; height: 500px; border-radius: 36px; background: rgba(255,255,255,.08);
    border: 5px solid transparent; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .pcard-on { border-color: #ffd76e; background: rgba(255,215,110,.14); transform: scale(1.04); }
  .pface { font-size: 151px; line-height: 1; }
  .pname { color: #fff; font-size: 44px; margin-top: 28px; }
  .pstars { color: #9fb4ff; font-size: 31px; margin-top: 13px; }
  code { color: #3ecf8e; font-size: 12px; }
</style>
</head>
<body>

  <h1>两个角色：豆豆 🐰 / 滔滔 🐳</h1>
  <p class="sub">
    两个角色都用 emoji 头像，照片 <code>static/photo.png</code> 不再参与显示（文件保留，随时可切回）。<br>
    屏幕按电视端 1920px 宽还原，1rpx = 2.56px。
  </p>

  <h2>① 启动页：选人（两个角色时才会出现）</h2>
  <div class="frame">
    <div class="prof-row">
      <div class="pcard pcard-on">
        <div class="pface">🐰</div>
        <div class="pname">豆豆</div>
        <div class="pstars">⭐ 12</div>
      </div>
      <div class="pcard">
        <div class="pface">🐳</div>
        <div class="pname">滔滔</div>
        <div class="pstars">⭐ 0</div>
      </div>
      <div class="pcard" style="opacity:.45">
        <div class="pface">＋</div>
        <div class="pname">新建</div>
        <div class="pstars">请家长添加</div>
      </div>
    </div>
  </div>
  <p class="note">金色描边 = 当前档案（默认豆豆）。选完进首页，之后每次启动都停在选人页。</p>

  <h2>② 首页顶部信息条</h2>
  <div class="frame">
    <div class="home-top">
      <div class="chip"><span class="chip-face-emoji">🐰</span> <span class="chip-text">豆豆</span></div>
      <div class="chip"><span class="chip-gold">⭐ 12</span></div>
      <div class="chip"><span class="chip-gold">🍬 7</span></div>
      <div class="top-space"></div>
      <div class="chip"><span class="chip-text">👨‍👩‍👧 家长门</span></div>
    </div>
  </div>
  <p class="note">右侧那条永远是当前档案：换成滔滔就显示「🐳 滔滔」。</p>

</body>
</html>
